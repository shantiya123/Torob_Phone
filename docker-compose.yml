services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: torob_phone
      POSTGRES_USER: torob_phone
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - torob_phone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torob_phone -d torob_phone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  torob_phone_postgres_data:
